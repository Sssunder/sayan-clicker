<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кот Саян — уютный кликер</title>
<meta name="description" content="Уютный кликер с котом Саяном и математическими задачками. Кликай по коту, решай задачки, копи лапки — прямо на доске или в браузере.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<script>if (new URLSearchParams(location.search).has("popup")) document.documentElement.classList.add("popup");</script>
<style>
  :root {
    --bg: #F5F5F7; --card: #FFFFFF; --text: #1D1D1F; --sub: #86868B;
    --hair: rgba(0,0,0,.07); --pill: #E8E8ED; --pill-text: #1D1D1F;
    --accent: #0A84FF; --sage: #34C759; --amber: #FF9F0A; --shadow: 0 8px 24px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0F; --card: #1C1C1E; --text: #F5F5F7; --sub: #98989D;
      --hair: rgba(255,255,255,.09); --pill: #2C2C2E; --pill-text: #F5F5F7;
      --shadow: 0 8px 24px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 100%/1.45 system-ui, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    -webkit-tap-highlight-color: transparent;
  }
  .app { width: min(430px, 100%); padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .app > * { flex-shrink: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; row-gap: 6px; }
  .spacer { flex: 1; }
  .card {
    background: var(--card); border: 1px solid var(--hair); border-radius: 20px;
    box-shadow: var(--shadow); padding: 14px;
  }
  button {
    font: inherit; color: var(--pill-text); background: var(--pill);
    border: 0; border-radius: 999px; cursor: pointer;
    transition: transform .1s ease-out, filter .1s ease-out;
    touch-action: manipulation; user-select: none;
  }
  button:active { transform: scale(.95); }
  .pill { padding: 7px 14px; font-size: 13px; font-weight: 600; }
  .pill.icon { padding: 7px 11px; font-size: 14px; }
  .title {
    background: none; padding: 2px 4px; font-size: 19px; font-weight: 700;
    letter-spacing: -.02em; color: var(--text);
  }
  .nameline { font-size: 12px; color: var(--sub); padding: 0 6px; margin-top: -4px; }
  .stage { position: relative; overflow: hidden; padding: 10px 12px 12px; min-height: 250px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
  .bubble {
    align-self: stretch; background: var(--pill); border-radius: 14px;
    padding: 8px 12px; font-size: 13px; font-weight: 500; min-height: 38px;
    display: flex; align-items: center;
  }
  #catWrap { position: relative; width: min(240px, 68vw); aspect-ratio: 1; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; will-change: transform; }
  #catWrap::before {
    content: ""; position: absolute; inset: -12%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(10,132,255,.14), transparent 70%);
  }
  #cat { width: 100%; height: 100%; object-fit: contain; border-radius: 24px;
    pointer-events: none; display: block; }
  .hint { font-size: 11.5px; color: var(--sub); text-align: center; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .float {
    position: absolute; font-weight: 700; font-size: 17px; color: var(--accent);
    transform: translate(-50%, 0); opacity: 0; letter-spacing: -.01em;
    text-shadow: 0 1px 0 var(--card);
  }
  .quiz { display: flex; flex-direction: column; gap: 8px; }
  .quiz[hidden] { display: none; }
  .quiz-title { font-size: 12.5px; font-weight: 700; color: var(--sage); }
  .quiz-close { padding: 2px 10px; font-size: 14px; }
  #quizQ { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .opts { display: flex; gap: 8px; }
  .opts button {
    flex: 1; padding: 9px 6px; border-radius: 12px; font-weight: 600; font-size: 14px;
    background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent);
  }
  .opts button:disabled { opacity: .55; cursor: default; }
  .opts button.right { background: var(--sage); color: #fff; opacity: 1; }
  .opts button.wrong { background: var(--amber); color: #fff; opacity: 1; }
  #quizFeedback { font-size: 12.5px; font-weight: 600; color: var(--sub); }
  #quizFeedback[hidden] { display: none; }
  .score-big { display: flex; align-items: baseline; gap: 7px; }
  #score { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .unit { font-size: 13px; color: var(--sub); font-weight: 600; }
  .combo { background: color-mix(in srgb, var(--amber) 18%, var(--card)); color: var(--amber); }
  .combo[hidden] { display: none; }
  .level { font-size: 12px; font-weight: 600; color: var(--sage); margin-top: 6px; }
  .level .nums { color: var(--sub); font-weight: 500; }
  .bar { height: 6px; border-radius: 3px; background: var(--pill); overflow: hidden; margin-top: 5px; }
  .bar > div { height: 100%; width: 0; border-radius: 3px; background: var(--accent); }
  .energy { margin-top: 9px; font-size: 11.5px; font-weight: 600; color: var(--sub); }
  .energy .bar { flex: 1; margin: 0; height: 5px; }
  .energy .bar > div { background: var(--amber); }
  #solved { color: var(--sage); }
  .foot { font-size: 11px; color: var(--sub); text-align: center; }
  html { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--sub) 50%, transparent) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--sub) 45%, transparent); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sub); }
  #pinBtn.active { background: color-mix(in srgb, var(--accent) 20%, var(--card)); color: var(--accent); }
  #closeBtn { display: none; }
  .popup .app { width: 100%; padding: 8px 8px 10px; gap: 8px; }
  .popup .card { padding: 10px; border-radius: 16px; }
  .popup .title { font-size: 16px; }
  .popup .pill { padding: 5px 10px; font-size: 12px; }
  .popup .pill.icon { padding: 5px 9px; font-size: 13px; }
  .popup .nameline { font-size: 11px; }
  .popup .stage { min-height: 0; padding: 8px 10px 10px; gap: 4px; }
  .popup .bubble { min-height: 30px; padding: 5px 10px; font-size: 12px; border-radius: 12px; }
  .popup #catWrap { width: min(168px, 54vw); }
  .popup .hint, .popup .foot, .popup #pinBtn, .popup #resetBtn { display: none; }
  .popup #closeBtn { display: inline-block; }
  .popup #score { font-size: 26px; }
  .popup .level { margin-top: 4px; }
  .popup .energy { margin-top: 6px; }
  .popup #quizQ { font-size: 14px; }
  .popup .opts button { padding: 7px 5px; font-size: 13px; }
  .clickpill { background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); }
  .shop-title { font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .rate { font-size: 12px; font-weight: 700; color: var(--sage); }
  #shopList { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .upg {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 12px;
    background: color-mix(in srgb, var(--pill) 55%, var(--card)); transition: background .3s;
  }
  .upg.bought { background: color-mix(in srgb, var(--sage) 18%, var(--card)); }
  .upg-ico { font-size: 18px; width: 26px; text-align: center; }
  .upg-info { flex: 1; min-width: 0; }
  .upg-name { font-size: 13px; font-weight: 700; }
  .upg-lvl { color: var(--sub); font-weight: 600; font-size: 11px; }
  .upg-eff { font-size: 11.5px; color: var(--sub); }
  .buy {
    padding: 6px 10px; font-size: 12px; font-weight: 700; white-space: nowrap;
    background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent);
  }
  .buy:disabled { opacity: .5; cursor: default; }
  .savecode { margin-top: 8px; }
  .savecode .pill { font-size: 11.5px; padding: 6px 10px; }
  .popup .upg { padding: 5px 6px; gap: 6px; }
  .popup .upg-ico { font-size: 15px; width: 20px; }
  .popup .upg-name { font-size: 12px; }
  .popup .upg-eff { font-size: 10.5px; }
  .popup .buy { padding: 5px 8px; font-size: 11px; }
  @media (max-width: 340px) {
    .pill { padding: 6px 10px; font-size: 12px; }
    #score { font-size: 28px; }
    .opts { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="row">
    <button class="title" id="titleBtn" title="Клик — подписаться своим именем">🐾 Кот Саян</button>
    <div class="spacer"></div>
    <button class="pill icon" id="poseBtn" aria-label="Сменить позу" title="Сменить позу">🖼️</button>
    <button class="pill icon" id="pinBtn" aria-label="Окошко поверх всех окон" aria-pressed="false" title="Открыть отдельное окошко поверх всех окон">📌</button>
    <button class="pill icon" id="soundBtn" aria-label="Звук">🔊</button>
    <button class="pill icon" id="resetBtn" aria-label="Начать заново" title="Начать заново (новый ученик)">🔄</button>
    <button class="pill icon" id="closeBtn" aria-label="Закрыть окошко" title="Закрыть окошко">✕</button>
  </header>
  <div class="nameline" id="nameLine" hidden></div>

  <section class="card stage" id="stage" aria-label="Кот Саян">
    <div class="bubble" id="bubble">Кликни по Саяну или нажми Пробел, чтобы погладить</div>
    <div id="catWrap"><img id="cat" src="assets/sprites/curious.png" alt="Кот Саян"></div>
    <div id="fx"></div>
    <div class="hint">Пробел — погладить · Q — задачка · 1/2/3 — ответ</div>
  </section>

  <section class="card quiz" id="quizCard" hidden aria-label="Задачка">
    <div class="row">
      <span class="quiz-title" id="quizTitle">📐 Быстрая задачка на +30 лапок</span>
      <div class="spacer"></div>
      <button class="quiz-close" id="quizClose" aria-label="Закрыть задачку">✕</button>
    </div>
    <div id="quizQ"></div>
    <div class="opts" id="quizOpts">
      <button></button><button></button><button></button>
    </div>
    <div id="quizFeedback" hidden></div>
  </section>

  <section class="card" aria-label="Прогресс">
    <div class="row wrap">
      <div class="score-big"><span id="score">0</span><span class="unit" id="unit">лапок</span></div>
      <div class="spacer"></div>
      <button class="pill" id="quizBtn" title="Попросить задачку сейчас (Q)">📐 Задачка</button>
      <span class="pill clickpill" id="clickPill">+1/клик</span>
      <span class="pill combo" id="comboPill" hidden>Комбо x2</span>
    </div>
    <div class="row level"><span id="levelTitle"></span><div class="spacer"></div><span class="nums" id="levelNums"></span></div>
    <div class="bar"><div id="levelBar"></div></div>
    <div class="row energy">
      <span>⚡</span>
      <div class="bar"><div id="energyBar"></div></div>
      <div class="spacer"></div>
      <span id="solved" title="Решено задачек">📐 0</span>
      <span id="mood">👀</span>
    </div>
  </section>

  <section class="card" aria-label="Прокачка">
    <div class="row">
      <span class="shop-title">🛒 Прокачка</span>
      <div class="spacer"></div>
      <span class="rate" id="ratePill">+0/сек</span>
    </div>
    <div id="shopList"></div>
    <div class="row savecode">
      <button class="pill" id="copySaveBtn" title="Скопировать код прогресса для другого компьютера">💾 Код сохранения</button>
      <button class="pill" id="loadSaveBtn" title="Ввести код с другого компьютера">📥 Ввести код</button>
    </div>
  </section>

  <footer class="foot">Прогресс сохраняется в браузере · 💾 код переносит его на другой компьютер</footer>
</main>

<script src="quiz-data.js"></script>
<script>
"use strict";
const D = window.SAYAN_DATA;
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const SAVE_KEY = "sayan_web_save_v1";
const store = {
  get() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, v); } catch (e) {} },
};
const S = Object.assign({ pets: 0, solved: 0, bestCombo: 0, name: null, sound: true, upg: {}, t: 0 },
  JSON.parse(store.get() || "{}"));
if (!S.upg || typeof S.upg !== "object") S.upg = {};

const SLEEP_IDLE = 18;
const ZOOMIES_SECONDS = 6, ZOOMIES_COOLDOWN = 35, QUIZ_CADENCE = 26;

let combo = 0, lastPet = -99, energy = 0, clicks = 0;
let zoomiesUntil = 0, zoomiesCooldownUntil = 0, sleeping = false, wakePoseUntil = 0;
let lastActivity = performance.now() / 1000, nextIdleQuiz = lastActivity + 75;
let quiz = null, reviewing = false, quizCursor = 0, reviewTimer = 0;
let shownScore = S.pets, saveTimer = 0;

const squash = { v: 0, vel: 0 };
function springStep(s, dt) {
  const w = 2 * Math.PI / 0.32, z = 0.55;
  const a = -w * w * s.v - 2 * z * w * s.vel;
  s.vel += a * dt; s.v += s.vel * dt;
}

const audio = { ctx: null, buffers: {} };
function initAudio() {
  if (audio.ctx || !S.sound) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio.ctx = new Ctx();
  for (const n of ["tap1","tap2","tap3","meow","meow2","treat","levelup","zoomies"]) {
    fetch("assets/sounds/" + n + ".wav").then(r => r.arrayBuffer())
      .then(b => audio.ctx.decodeAudioData(b))
      .then(buf => { audio.buffers[n] = buf; }).catch(() => {});
  }
}
function play(name) {
  if (!S.sound || !audio.ctx || !audio.buffers[name]) return;
  if (audio.ctx.state === "suspended") audio.ctx.resume();
  const src = audio.ctx.createBufferSource();
  src.buffer = audio.buffers[name];
  src.connect(audio.ctx.destination);
  src.start();
}
const tap = () => play(Math.random() < 0.14 ? (Math.random() < .5 ? "meow" : "meow2")
  : "tap" + (1 + Math.floor(Math.random() * 3)));

function plural(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "лапка";
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "лапки";
  return "лапок";
}
function levelInfo(count) {
  let i = 0;
  for (let k = 0; k < D.levels.length; k++) if (count >= D.levels[k][0]) i = k;
  const [th, title] = D.levels[i];
  const next = D.levels[i + 1] || null;
  const ratio = next ? Math.min(1, Math.max(0, (count - th) / (next[0] - th))) : 1;
  return { i, title, th, next, ratio };
}
function say(text) { $("bubble").textContent = text; }

function fmt(n) {
  if (n < 100000) return Math.round(n).toLocaleString("ru-RU");
  n = Math.floor(n);
  if (n < 1e6) return (n / 1e3).toFixed(1).replace(".", ",") + " тыс.";
  if (n < 1e9) return (n / 1e6).toFixed(1).replace(".", ",") + " млн";
  return (n / 1e9).toFixed(1).replace(".", ",") + " млрд";
}

const UPG = [
  { id: "click", ico: "🐾", name: "Сильная лапа", base: 20, g: 1.6, max: 25,
    eff: l => "клик даёт +" + (1 + l) },
  { id: "bowl", ico: "🍖", name: "Миска вкусняшек", base: 30, g: 1.15, max: 50, rate: 1,
    eff: l => "+" + l + "/сек · по 1 за миску" },
  { id: "scratch", ico: "🪵", name: "Когтеточка", base: 250, g: 1.15, max: 50, rate: 6,
    eff: l => "+" + (l * 6) + "/сек · по 6 за штуку" },
  { id: "fountain", ico: "⛲", name: "Рыбный фонтан", base: 1500, g: 1.15, max: 50, rate: 25,
    eff: l => "+" + (l * 25) + "/сек · по 25 за штуку" },
  { id: "clone", ico: "🐈", name: "Саян-клон", base: 8000, g: 1.15, max: 50, rate: 120,
    eff: l => "+" + (l * 120) + "/сек · по 120 за клона" },
  { id: "quiz", ico: "🎓", name: "Учёный кот", base: 100, g: 2, max: 10,
    eff: l => "задачка даёт +" + (D.quizReward + 15 * l) },
  { id: "combo", ico: "🔥", name: "Комбо-мастер", base: 120, g: 2.2, max: 6,
    eff: l => "комбо держится " + (1.4 + .25 * l).toFixed(2).replace(".", ",") + " с" },
  { id: "zoom", ico: "⚡", name: "Тыгыдык-тренер", base: 200, g: 2.4, max: 5,
    eff: l => "тыгыдык ×" + (5 + l) },
];
const lvl = id => S.upg[id] || 0;
const cost = (u, l) => Math.floor(u.base * Math.pow(u.g, l));
const clickPower = () => 1 + lvl("click");
const passiveRate = () => UPG.reduce((s, u) => s + (u.rate || 0) * lvl(u.id), 0);
const quizReward = () => D.quizReward + 15 * lvl("quiz");
const comboWindow = () => 1.4 + .25 * lvl("combo");
const zoomMult = () => 5 + lvl("zoom");

function addPets(gain, silent) {
  const prev = S.pets;
  S.pets += gain;
  const li0 = levelInfo(prev), li1 = levelInfo(S.pets);
  if (li1.i > li0.i) { say("Новый уровень: " + li1.title + "! 🎉"); play("levelup"); return true; }
  if (!silent) {
    for (const k in D.milestones) {
      const th = +k;
      if (prev < th && S.pets >= th) { say(D.milestones[k]); return true; }
    }
  }
  return false;
}

function floatText(text, x, y, color) {
  const el = document.createElement("span");
  el.className = "float";
  el.textContent = text;
  if (color) el.style.color = color;
  el.style.left = x + "px"; el.style.top = y + "px";
  $("fx").appendChild(el);
  const t0 = performance.now();
  (function anim(t) {
    const p = (t - t0) / 900;
    if (p >= 1) { el.remove(); return; }
    el.style.opacity = String(p < .15 ? p / .15 : 1 - (p - .15) / .85);
    el.style.transform = `translate(-50%, ${reduced ? 0 : -46 * p}px)`;
    requestAnimationFrame(anim);
  })(t0);
}
function floatAtCat(text, color) {
  const stage = $("stage").getBoundingClientRect();
  const cat = $("catWrap").getBoundingClientRect();
  floatText(text, cat.left - stage.left + cat.width * (0.3 + Math.random() * .4),
    cat.top - stage.top + cat.height * .25, color);
}

function save() {
  S.t = Date.now();
  store.set(JSON.stringify(S));
}
function queueSave() {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = 0; save(); }, 800);
}

const AWAKE_POSES = ["curious.png", "photo_window.jpg", "photo_cuddle.jpg", "photo_sink.jpg"];
const SLEEP_POSES = ["sleep_cozy.png", "photo_nap.jpg", "photo_sofa.jpg", "photo_sill_nap.jpg"];
let awakePose = 0, sleepPose = 0;
let nextPoseAt = performance.now() / 1000 + 20;
for (const f of AWAKE_POSES.concat(SLEEP_POSES)) {
  const im = new Image();
  im.src = "assets/sprites/" + f;
}

function setPose() {
  const now = performance.now() / 1000;
  const file = now < zoomiesUntil ? "zoomies.png" : now < wakePoseUntil ? "stretch.png"
    : sleeping ? SLEEP_POSES[sleepPose] : AWAKE_POSES[awakePose];
  const want = "assets/sprites/" + file;
  if ($("cat").getAttribute("src") !== want) {
    $("cat").setAttribute("src", want);
    squash.vel -= 1.5;
  }
}

function startZoomies(now) {
  zoomiesUntil = now + ZOOMIES_SECONDS;
  zoomiesCooldownUntil = now + ZOOMIES_SECONDS + ZOOMIES_COOLDOWN;
  energy = 100;
  say("ТЫГЫДЫК! ⚡ Клики дают ×" + zoomMult() + " лапок!");
  play("zoomies");
}

function pet() {
  const now = performance.now() / 1000;
  lastActivity = now; nextIdleQuiz = now + 75;
  initAudio();
  let gain = clickPower();
  if (sleeping) {
    sleeping = false; wakePoseUntil = now + 1.5; gain += 5;
    say((S.name ? S.name + ", " : "") + "Саян проснулся! +5 лапок за побудку 🌤");
    play("meow");
  }
  combo = (now - lastPet <= comboWindow()) ? combo + 1 : 1;
  lastPet = now;
  S.bestCombo = Math.max(S.bestCombo, combo);
  if (combo >= 10) gain += 2; else if (combo >= 5) gain += 1;
  if (now < zoomiesUntil) gain *= zoomMult();
  const celebrated = addPets(gain);
  clicks++;
  if (!sleeping) {
    energy = Math.min(100, energy + 2);
    if (energy >= 100 && now >= zoomiesCooldownUntil) startZoomies(now);
  }
  squash.vel -= 5.5;
  floatAtCat("+" + fmt(gain));
  tap();
  if (combo === 5 && !celebrated) say("Комбо x5! Саян мурчит от восторга 🔥");
  if (clicks % QUIZ_CADENCE === 0 && !quiz) spawnQuiz();
  refresh();
  queueSave();
}

function spawnQuiz() {
  if (quiz) return;
  quiz = D.quiz[quizCursor++ % D.quiz.length];
  reviewing = false;
  $("quizQ").textContent = quiz.q;
  const btns = $("quizOpts").children;
  for (let i = 0; i < 3; i++) {
    btns[i].textContent = quiz.o[i];
    btns[i].disabled = false;
    btns[i].className = "";
    btns[i].title = "Ответ " + (i + 1) + " — клавиша " + (i + 1);
  }
  $("quizFeedback").hidden = true;
  $("quizCard").hidden = false;
  play("treat");
}
function hideQuiz() {
  quiz = null; reviewing = false;
  clearTimeout(reviewTimer);
  $("quizCard").hidden = true;
}
function answer(i) {
  if (!quiz || reviewing) return;
  reviewing = true;
  const btns = $("quizOpts").children;
  for (const b of btns) b.disabled = true;
  const fb = $("quizFeedback");
  fb.hidden = false;
  if (i === quiz.c) {
    btns[i].className = "right";
    const rw = quizReward();
    addPets(rw); S.solved++;
    fb.textContent = "Верно! +" + rw + " лапок 🐾";
    play("treat");
    floatAtCat("+" + rw, "var(--sage)");
    reviewTimer = setTimeout(hideQuiz, 1200);
  } else {
    btns[i].className = "wrong";
    btns[quiz.c].className = "right";
    fb.textContent = "Не совсем. Верно: " + quiz.o[quiz.c] + ". " + quiz.e;
    play("meow2");
    reviewTimer = setTimeout(hideQuiz, 3200);
  }
  refresh();
  queueSave();
}

function refresh() {
  const li = levelInfo(S.pets);
  $("levelTitle").textContent = "Ур. " + (li.i + 1) + " · " + li.title;
  $("levelNums").textContent = li.next ? fmt(S.pets) + " / " + fmt(li.next[0]) : fmt(S.pets) + " · максимум";
  $("levelBar").style.width = (li.ratio * 100).toFixed(1) + "%";
  $("solved").textContent = "📐 " + S.solved;
  $("unit").textContent = plural(Math.floor(S.pets));
  $("clickPill").textContent = "+" + fmt(clickPower()) + "/клик";
  $("ratePill").textContent = "+" + fmt(passiveRate()) + "/сек";
  $("mood").textContent = sleeping ? "😴" : performance.now() / 1000 < zoomiesUntil ? "⚡"
    : combo >= 5 ? "😻" : "👀";
  $("nameLine").hidden = !S.name;
  if (S.name) $("nameLine").textContent = "👋 " + S.name;
  $("soundBtn").textContent = S.sound ? "🔊" : "🔇";
}

let lastT = performance.now();
let lastShopUi = 0, lastAutoSave = 0;
function tick(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  const now = t / 1000;
  const rate = passiveRate();
  if (rate > 0) {
    addPets(rate * dt, true);
    if (now - lastAutoSave > 5) { lastAutoSave = now; save(); }
  }
  if (t - lastShopUi > 250) { lastShopUi = t; updateShop(); }
  springStep(squash, dt);
  const wrap = $("catWrap");
  let x = 0, tilt = 0, bob = 0;
  if (!reduced) {
    bob = Math.sin(now * 1.7) * 3;
    if (now < zoomiesUntil) {
      const stageW = $("stage").clientWidth;
      const amp = Math.max(0, stageW / 2 - wrap.offsetWidth / 2 - 10);
      x = Math.sin(now * 5.2) * amp;
      tilt = Math.cos(now * 5.2) * 7;
      energy = Math.max(0, 100 * (zoomiesUntil - now) / ZOOMIES_SECONDS);
    } else if (energy > 0 && now >= zoomiesUntil) {
      energy = Math.max(0, energy - dt * 4);
    }
  }
  const sy = 1 - .12 * squash.v, sx = 1 + .10 * squash.v;
  wrap.style.transform = `translate(${x}px, ${bob}px) rotate(${tilt}deg) scale(${sx}, ${sy})`;
  if (!sleeping && now - lastActivity > SLEEP_IDLE) {
    sleeping = true;
    say("Zzz… погладь, чтобы разбудить (+5) 💤");
  }
  if (sleeping && Math.floor(now) % 3 === 0 && Math.floor(now) !== tick.lastZzz) {
    tick.lastZzz = Math.floor(now);
    floatAtCat("Zzz", "var(--sub)");
  }
  if (now > nextPoseAt) {
    nextPoseAt = now + 20 + Math.random() * 15;
    if (sleeping) sleepPose = (sleepPose + 1) % SLEEP_POSES.length;
    else awakePose = (awakePose + 1) % AWAKE_POSES.length;
  }
  if (!quiz && now > nextIdleQuiz) { nextIdleQuiz = now + 75; spawnQuiz(); }
  const cp = $("comboPill");
  if (combo >= 2 && now - lastPet <= comboWindow()) { cp.hidden = false; cp.textContent = "Комбо x" + combo; }
  else cp.hidden = true;
  shownScore += (S.pets - shownScore) * Math.min(1, dt * 10);
  if (Math.abs(S.pets - shownScore) < .6) shownScore = S.pets;
  $("score").textContent = fmt(shownScore);
  $("energyBar").style.width = energy.toFixed(0) + "%";
  setPose();
  requestAnimationFrame(tick);
}

$("catWrap").addEventListener("pointerdown", e => { e.preventDefault(); pet(); });
$("quizBtn").addEventListener("click", spawnQuiz);
$("poseBtn").addEventListener("click", () => {
  const now = performance.now() / 1000;
  if (sleeping) sleepPose = (sleepPose + 1) % SLEEP_POSES.length;
  else awakePose = (awakePose + 1) % AWAKE_POSES.length;
  nextPoseAt = now + 20 + Math.random() * 15;
  initAudio();
  tap();
});
$("quizClose").addEventListener("click", hideQuiz);
[...$("quizOpts").children].forEach((b, i) => b.addEventListener("click", () => answer(i)));
$("soundBtn").addEventListener("click", () => {
  S.sound = !S.sound;
  if (S.sound) initAudio();
  refresh(); queueSave();
});
$("resetBtn").addEventListener("click", () => {
  if (!confirm("Начать заново? Лапки, прокачка и задачки обнулятся.\nИмя и звук останутся.")) return;
  S.pets = 0; S.solved = 0; S.bestCombo = 0; S.upg = {};
  combo = 0; energy = 0; clicks = 0; shownScore = 0; sleeping = false;
  hideQuiz();
  say("Новый ученик за партой! Мяу — начнём с первой лапки! 🐾");
  play("meow");
  refresh(); updateShop(); save();
});
$("titleBtn").addEventListener("click", () => {
  const name = prompt("Как тебя зовут? Имя появится под заголовком.", S.name || "");
  if (name === null) return;
  S.name = name.trim().slice(0, 40) || null;
  say(S.name ? "Теперь Саян знает тебя: " + S.name + " 🏅" : "Кот Саян");
  refresh(); queueSave();
});
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); pet(); }
  else if (e.code === "KeyQ") spawnQuiz();
  else if (e.code === "Digit1") answer(0);
  else if (e.code === "Digit2") answer(1);
  else if (e.code === "Digit3") answer(2);
});
window.addEventListener("beforeunload", save);
window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

window.addEventListener("storage", e => {
  if (e.key !== SAVE_KEY || !e.newValue) return;
  try {
    const inc = JSON.parse(e.newValue);
    S.pets = Number(inc.pets) || 0;
    S.solved = Number(inc.solved) || 0;
    S.bestCombo = Number(inc.bestCombo) || 0;
    S.name = inc.name || null;
    S.sound = inc.sound !== false;
    S.upg = (inc.upg && typeof inc.upg === "object") ? inc.upg : {};
    refresh(); updateShop();
  } catch (err) {}
});

const popupUrl = (() => {
  const u = new URL(location.href);
  u.hash = "";
  u.searchParams.set("popup", "1");
  return u.toString();
})();
let pipWin = null, popupWin = null, popupPoll = 0;
function pinActive() { return !!(pipWin || (popupWin && !popupWin.closed)); }
function refreshPin() {
  const on = pinActive();
  $("pinBtn").classList.toggle("active", on);
  $("pinBtn").setAttribute("aria-pressed", String(on));
  $("pinBtn").title = on ? "Закрыть окошко «поверх всех окон»" : "Открыть отдельное окошко поверх всех окон";
}
function stopPopupPoll() { if (popupPoll) { clearInterval(popupPoll); popupPoll = 0; } }
async function togglePinned() {
  initAudio();
  if (pipWin) { pipWin.close(); pipWin = null; refreshPin(); return; }
  if (popupWin && !popupWin.closed) { popupWin.close(); popupWin = null; stopPopupPoll(); refreshPin(); return; }
  if ("documentPictureInPicture" in window) {
    try {
      pipWin = await documentPictureInPicture.requestWindow({ width: 340, height: 580 });
      const doc = pipWin.document;
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      const st = doc.createElement("style");
      st.textContent = "html,body{margin:0;height:100%;background:" + (dark ? "#0B0B0F" : "#F5F5F7") +
        "}iframe{display:block;border:0;width:100%;height:100%}";
      doc.head.appendChild(st);
      const fr = doc.createElement("iframe");
      fr.src = popupUrl;
      fr.allow = "autoplay";
      fr.title = "Кот Саян — окошко поверх всех окон";
      doc.body.appendChild(fr);
      pipWin.addEventListener("pagehide", () => { pipWin = null; refreshPin(); });
      say("Саян теперь в окошке поверх всех окон 📌 Кликай прямо там!");
      play("treat");
      refreshPin();
      return;
    } catch (e) { pipWin = null; }
  }
  popupWin = window.open(popupUrl, "sayan_pinned", "width=360,height=620");
  if (!popupWin) { say("Браузер не дал открыть окошко 🙏 Разреши всплывающие окна для этого сайта."); return; }
  popupWin.focus();
  stopPopupPoll();
  popupPoll = setInterval(() => {
    if (!popupWin || popupWin.closed) { popupWin = null; stopPopupPoll(); refreshPin(); }
  }, 600);
  say("Открылось отдельное окошко 📌 Держи его поверх урока — клики работают!");
  refreshPin();
}
$("pinBtn").addEventListener("click", togglePinned);
$("closeBtn").addEventListener("click", () => {
  save();
  try { window.top.close(); } catch (e) {}
  window.close();
});

const shopList = $("shopList");
for (const u of UPG) {
  const row = document.createElement("div");
  row.className = "upg";
  row.id = "upg-" + u.id;
  row.innerHTML = '<div class="upg-ico">' + u.ico + '</div>' +
    '<div class="upg-info"><div class="upg-name">' + u.name + ' <span class="upg-lvl"></span></div>' +
    '<div class="upg-eff"></div></div><button class="pill buy"></button>';
  shopList.appendChild(row);
  row.querySelector(".buy").addEventListener("click", () => buy(u));
}
function updateShop() {
  for (const u of UPG) {
    const l = lvl(u.id);
    const row = $("upg-" + u.id);
    row.querySelector(".upg-lvl").textContent = l ? "ур. " + l : "";
    row.querySelector(".upg-eff").textContent = u.eff(l);
    const b = row.querySelector(".buy");
    if (l >= u.max) { b.textContent = "МАКС"; b.disabled = true; }
    else { const c = cost(u, l); b.textContent = fmt(c) + " 🐾"; b.disabled = S.pets < c; }
  }
}
function buy(u) {
  const l = lvl(u.id);
  if (l >= u.max) return;
  const c = cost(u, l);
  if (S.pets < c) return;
  S.pets -= c;
  S.upg[u.id] = l + 1;
  play("treat");
  squash.vel -= 3;
  say("Куплено: " + u.name + " " + u.ico + " Теперь " + u.eff(l + 1) + "!");
  const row = $("upg-" + u.id);
  row.classList.add("bought");
  setTimeout(() => row.classList.remove("bought"), 600);
  refresh(); updateShop(); queueSave();
}

function exportCode() {
  const payload = { v: 1, pets: S.pets, solved: S.solved, bestCombo: S.bestCombo,
    name: S.name, sound: S.sound, upg: S.upg, t: Date.now() };
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return "SAYAN1." + btoa(bin);
}
function importCode(code) {
  code = (code || "").trim();
  if (!code.startsWith("SAYAN1.")) { say("Это не код Саяна 🙈"); return; }
  try {
    const bin = atob(code.slice(7));
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
    if (o.v !== 1 || typeof o.pets !== "number" || !isFinite(o.pets)) throw 0;
    S.pets = Math.max(0, o.pets);
    S.solved = Math.max(0, Number(o.solved) || 0);
    S.bestCombo = Math.max(0, Number(o.bestCombo) || 0);
    S.name = typeof o.name === "string" ? o.name.slice(0, 40) : null;
    S.sound = o.sound !== false;
    S.upg = {};
    if (o.upg && typeof o.upg === "object")
      for (const u of UPG) S.upg[u.id] = Math.min(u.max, Math.max(0, Math.floor(Number(o.upg[u.id]) || 0)));
    shownScore = S.pets;
    hideQuiz();
    refresh(); updateShop(); save();
    say("Прогресс восстановлен! С возвращением" + (S.name ? ", " + S.name : "") + " 🐾");
    play("levelup");
  } catch (e) { say("Код не читается 🙈 Проверь, что скопирован целиком."); }
}
$("copySaveBtn").addEventListener("click", async () => {
  const code = exportCode();
  try {
    await navigator.clipboard.writeText(code);
    say("Код скопирован! На другом компьютере нажми 📥 и вставь его 💾");
  } catch (e) {
    prompt("Скопируй код сохранения (Ctrl+C) и вставь на другом компьютере через 📥:", code);
  }
});
$("loadSaveBtn").addEventListener("click", () => {
  const code = prompt("Вставь код сохранения с другого компьютера:");
  if (code !== null) importCode(code);
});

let offlineMsg = null;
if (S.t && passiveRate() > 0) {
  const away = (Date.now() - S.t) / 1000;
  if (away > 60) {
    const gain = Math.floor(passiveRate() * Math.min(away, 7200) * .5);
    if (gain > 0) {
      S.pets += gain;
      shownScore = S.pets;
      offlineMsg = "Пока тебя не было, помощники намяли +" + fmt(gain) + " лапок 🐾";
    }
  }
}

refresh();
updateShop();
if (offlineMsg) say(offlineMsg);
refreshPin();
requestAnimationFrame(tick);
</script>
</body>
</html>
